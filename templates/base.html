{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}MFS Gateway | Merchant Dashboard{% endblock %}</title>

    <!-- PWA Primary Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MFS Gateway">
    <meta name="application-name" content="MFS Gateway">
    <meta name="description" content="Multi-tenant MFS payment aggregator merchant portal and forwarder SMS bridge.">

    <!-- App Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/icon.svg' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
    <link rel="shortcut icon" href="{% static 'icons/favicon.png' %}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        bkash: '#E2136E',
                        nagad: '#F7941D',
                        rocket: '#8C3494',
                        cellfin: '#00693E',
                        upay: '#FFCD00',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col selection:bg-rose-500 selection:text-white">

    <!-- Offline Connection Warning Toast -->
    <div id="offline-toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-rose-600 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 hidden transition-all duration-300">
        <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
        <span>Offline Mode: Displaying cached records.</span>
    </div>

    <!-- Navigation Header -->
    <nav class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 sm:px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/dashboard/" class="flex items-center gap-2.5">
                    <img src="{% static 'icons/icon.svg' %}" alt="MFS Gateway Logo" class="w-8 h-8 rounded-lg shadow-md shadow-rose-600/20">
                    <span class="text-base font-heading font-extrabold tracking-tight text-white flex items-center gap-1.5">
                        MFS Gateway <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">PWA</span>
                    </span>
                </a>
            </div>

            <!-- Right Controls: PWA Install & System Links -->
            <div class="flex items-center gap-2.5">
                <!-- Install PWA Button (Visible when beforeinstallprompt fires) -->
                <button id="pwa-install-btn" onclick="promptInstallPWA()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white text-xs font-bold shadow-lg shadow-rose-600/20 transition active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Install App</span>
                </button>

                <!-- Admin Link -->
                <a href="/admin/" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700/80 transition flex items-center gap-1">
                    <span>Django Admin</span>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Slot -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- PWA Service Worker Registration & Install Script -->
    <script>
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then((reg) => {
                        console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('[PWA] ServiceWorker registration failed:', err);
                    });
            });
        }

        // 2. PWA Installation Prompt Handler
        let deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent immediate browser mini-infobar
            e.preventDefault();
            deferredPrompt = e;
            // Show custom install button
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('inline-flex');
            }
        });

        window.addEventListener('appinstalled', () => {
            console.log('[PWA] Application successfully installed.');
            if (installBtn) {
                installBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        function promptInstallPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('[PWA] User accepted install prompt');
                } else {
                    console.log('[PWA] User dismissed install prompt');
                }
                deferredPrompt = null;
                if (installBtn) installBtn.classList.add('hidden');
            });
        }

        // 3. Online/Offline Network Status Listeners
        const offlineToast = document.getElementById('offline-toast');
        function updateOnlineStatus() {
            if (!navigator.onLine) {
                offlineToast.classList.remove('hidden');
            } else {
                offlineToast.classList.add('hidden');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
